version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rukunwarga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=host=db user=postgres password=password dbname=rukunwarga port=5432 sslmode=disable
    depends_on:
      - db

volumes:
  postgres_data:
